name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned by SHA (tag in the comment): third-party code running in CI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]" pyflakes pip-audit
      - run: python -m pyflakes droid_tier tests
      # Fails on known CVEs in the dependencies (textual, tomlkit, ...).
      # --skip-editable: droid-tier itself is the local checkout, nothing to audit.
      - run: python -m pip-audit --skip-editable
      - run: python -m pytest -q
